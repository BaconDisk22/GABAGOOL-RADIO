name: Gabagool Demo Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-screenshot:
    # The app bundles ARM-only native libraries. Use an ARM64 macOS host/emulator.
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Capture Android demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/capture-gabagool-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gabagool-android-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

  macos-screenshot:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Launch desktop offline demo and capture screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          ./gradlew :desktopApp:run --args="--demo" > /tmp/gabagool-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          sleep 75
          if ! kill -0 "$demo_pid" 2>/dev/null; then cat /tmp/gabagool-demo.log; exit 1; fi
          screencapture -x screenshots/gabagool-macos-demo.png
          test -s screenshots/gabagool-macos-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gabagool-macos-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
