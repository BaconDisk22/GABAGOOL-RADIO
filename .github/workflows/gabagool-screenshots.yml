name: Gabagool Demo Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            ./gradlew :androidApp:assembleFdroidDebug --stacktrace
            echo "Built APK locations:"
            find androidApp/build/outputs -type f -name '*.apk' -print
            apk=$(find androidApp/build/outputs -type f -name '*fdroid*debug*.apk' -print -quit)
            if [ -z "$apk" ]; then apk=$(find androidApp/build/outputs -type f -name '*.apk' -print -quit); fi
            test -n "$apk"
            adb install -r "$apk"
            pkg=com.bacondisk22.gabagoolradio.fdroid.debug
            adb shell am start -n "$pkg/org.meshtastic.app.GabagoolDemoActivity"
            sleep 8
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/gabagool-android-demo.png
            test -s screenshots/gabagool-android-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gabagool-android-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

  macos-screenshot:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Launch desktop offline demo and capture screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          ./gradlew :desktopApp:run --args="--demo" > /tmp/gabagool-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          sleep 75
          if ! kill -0 "$demo_pid" 2>/dev/null; then cat /tmp/gabagool-demo.log; exit 1; fi
          screencapture -x screenshots/gabagool-macos-demo.png
          test -s screenshots/gabagool-macos-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gabagool-macos-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
