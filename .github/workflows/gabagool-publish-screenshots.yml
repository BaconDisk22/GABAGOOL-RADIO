name: Publish Gabagool Screenshots to README

on:
  workflow_run:
    workflows: ["Gabagool Demo Screenshots"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: gabagool-readme-screenshots
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'BaconDisk22/GABAGOOL-RADIO' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download screenshots from successful main workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name gabagool-android-screenshots --dir screenshots
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name gabagool-macos-screenshots --dir screenshots
          test -s screenshots/gabagool-android-demo.png
          test -s screenshots/gabagool-macos-demo.png
          file screenshots/*.png
          # Reject unexpectedly large files from automated screenshot capture.
          for img in screenshots/*.png; do
            test "$(stat -c %s "$img")" -lt 10000000
          done
      - name: Commit screenshots so README images render on GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/gabagool-android-demo.png screenshots/gabagool-macos-demo.png
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "docs: refresh demo screenshots [skip ci]"
          git push origin HEAD:main
